# A2 key-mapping seed: real FreeCol resource keys -> original-Colonization art.
#
# This file is COMMITTED and appended verbatim into the git-ignored pack's
# resources.properties by ClassicAssetConverter (ant classic-assets), so
# regenerating the pack never clobbers these aliases.  Because the pack is
# loaded last (highest priority, see FreeColClient.withClassicOriginalPack),
# these override the base/default FreeCol art when --classic is active.
#
# Syntax: <real FreeCol key>=resource:<image.classic_original.* scaffold key>
# (the "resource:" scheme links one key to another already-defined resource;
# the scaffold keys are listed above this block in resources.properties.)
#
# Grow this table alongside the UI phases (terrain/units/goods land with Phase 1,
# the colony/europe screens with Phase 2).  Keep each alias's target key present
# in the pack or the resource load will warn.

# Main-panel background -> the original title/opening screen.
# Rendered live by the Phase-0 ClassicGUI placeholder as an end-to-end proof.
image.background.MainPanel=resource:image.classic_original.pik.OPENING.PIK

# Colony-screen background -> the original colony screen (used from Phase 2).
image.background.ColonyPanel=resource:image.classic_original.pik.COLONY.PIK

# --- Terrain (Phase 1) ---------------------------------------------------
# The original rectangular map tiles come from TERRAIN.SS (12 frames, 16x16).
# Frame order is the canonical Colonization terrain enum, documented in
# net.sf.freecol.tools.ColonizationMapReader (0x00..0x07 = the eight base land
# terrains, in this exact order) and confirmed by visual inspection of the
# extracted frames:
#   000 tundra  001 desert  002 plains   003 prairie
#   004 grassland 005 savannah 006 marsh 007 swamp
#   008 (desert+cacti variant, unused)  009 arctic  010 ocean  011 sea lane
# Aliasing image.tile.<type>.center swaps these rectangular sprites in for
# FreeCol's isometric 128x64 diamonds, so the classic rectangular grid fills
# cleanly (see ClassicMapViewer).

# Base land terrains.
image.tile.model.tile.tundra.center=resource:image.classic_original.ss.TERRAIN.SS.000
image.tile.model.tile.desert.center=resource:image.classic_original.ss.TERRAIN.SS.001
image.tile.model.tile.plains.center=resource:image.classic_original.ss.TERRAIN.SS.002
image.tile.model.tile.prairie.center=resource:image.classic_original.ss.TERRAIN.SS.003
image.tile.model.tile.grassland.center=resource:image.classic_original.ss.TERRAIN.SS.004
image.tile.model.tile.savannah.center=resource:image.classic_original.ss.TERRAIN.SS.005
image.tile.model.tile.marsh.center=resource:image.classic_original.ss.TERRAIN.SS.006
image.tile.model.tile.swamp.center=resource:image.classic_original.ss.TERRAIN.SS.007
image.tile.model.tile.arctic.center=resource:image.classic_original.ss.TERRAIN.SS.009

# Hills and mountains have no dedicated base texture in TERRAIN.SS (they are
# drawn as overlays on a base terrain in Col1); use plains as the base, exactly
# as FreeCol's own default resources do.
image.tile.model.tile.hills.center=resource:image.classic_original.ss.TERRAIN.SS.002
image.tile.model.tile.mountains.center=resource:image.classic_original.ss.TERRAIN.SS.002

# Water: ocean, plus lake / great river reuse the ocean tile; high seas = sea lane.
image.tile.model.tile.ocean.center=resource:image.classic_original.ss.TERRAIN.SS.010
image.tile.model.tile.lake.center=resource:image.classic_original.ss.TERRAIN.SS.010
image.tile.model.tile.greatRiver.center=resource:image.classic_original.ss.TERRAIN.SS.010
image.tile.model.tile.highSeas.center=resource:image.classic_original.ss.TERRAIN.SS.011

# Forest tiles: until per-tile tree overlays are composited, render the forest
# .center as its underlying base terrain (the Col1 forest/base pairing, mirrored
# from FreeCol's own defaults): boreal->tundra, scrub->desert, mixed->plains,
# broadleaf->prairie, conifer->grassland, tropical->savannah, wetland->marsh,
# rain->swamp.
image.tile.model.tile.borealForest.center=resource:image.classic_original.ss.TERRAIN.SS.000
image.tile.model.tile.scrubForest.center=resource:image.classic_original.ss.TERRAIN.SS.001
image.tile.model.tile.mixedForest.center=resource:image.classic_original.ss.TERRAIN.SS.002
image.tile.model.tile.broadleafForest.center=resource:image.classic_original.ss.TERRAIN.SS.003
image.tile.model.tile.coniferForest.center=resource:image.classic_original.ss.TERRAIN.SS.004
image.tile.model.tile.tropicalForest.center=resource:image.classic_original.ss.TERRAIN.SS.005
image.tile.model.tile.wetlandForest.center=resource:image.classic_original.ss.TERRAIN.SS.006
image.tile.model.tile.rainForest.center=resource:image.classic_original.ss.TERRAIN.SS.007
