# A2 key-mapping seed: real FreeCol resource keys -> original-Colonization art.
#
# This file is COMMITTED and appended verbatim into the git-ignored pack's
# resources.properties by ClassicAssetConverter (ant classic-assets), so
# regenerating the pack never clobbers these aliases.  Because the pack is
# loaded last (highest priority, see FreeColClient.withClassicOriginalPack),
# these override the base/default FreeCol art when --classic is active.
#
# Syntax: <real FreeCol key>=resource:<image.classic_original.* scaffold key>
# (the "resource:" scheme links one key to another already-defined resource;
# the scaffold keys are listed above this block in resources.properties.)
#
# Grow this table alongside the UI phases (terrain/units/goods land with Phase 1,
# the colony/europe screens with Phase 2).  Keep each alias's target key present
# in the pack or the resource load will warn.

# Main-panel background -> the original title/opening screen.
# Rendered live by the Phase-0 ClassicGUI placeholder as an end-to-end proof.
image.background.MainPanel=resource:image.classic_original.pik.OPENING.PIK

# Colony-screen background -> the original colony screen (used from Phase 2).
image.background.ColonyPanel=resource:image.classic_original.pik.COLONY.PIK
